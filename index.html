<style>
  :root{
    --bg:#f6f4ef; --surface:#ffffff; --surface2:#efece4; --ink:#1d1a15; --ink2:#5c564a;
    --line:#e2ddd0; --accent:#03a94d; --accent-ink:#027a38;
    --c-restaurant:#d9480f; --c-cafe:#1971c2; --c-bakery:#e8890c; --c-etc:#2f9e44;
    --chip-bg:#efece4;
    --shadow:0 1px 3px rgba(29,26,21,.08),0 4px 14px rgba(29,26,21,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171512; --surface:#211e1a; --surface2:#2a2621; --ink:#f0ece2; --ink2:#b3ab9c;
      --line:#3a352d; --accent:#2bd576; --accent-ink:#2bd576;
      --chip-bg:#2a2621;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}
  a{color:var(--accent-ink)}

  header.top{
    max-width:1280px;margin:0 auto;padding:22px 20px 6px;
    display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;
  }
  header.top h1{font-size:clamp(24px,4vw,34px);margin:0;font-weight:800;letter-spacing:-.02em}
  header.top .count{
    font-size:15px;font-weight:700;color:var(--accent-ink);
    background:color-mix(in srgb,var(--accent) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    padding:4px 12px;border-radius:999px;margin-bottom:4px;
  }
  header.top .sub{width:100%;color:var(--ink2);font-size:14px;margin:2px 0 0}

  .toolbar{
    max-width:1280px;margin:0 auto;padding:12px 20px 4px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  }
  .search{flex:1 1 240px;display:flex}
  .search input{
    width:100%;padding:10px 14px;font-size:15px;border:1px solid var(--line);
    border-radius:12px;background:var(--surface);color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .filters button{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:2.25rem;
  }
  .filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .filters button .n{opacity:.65;font-weight:500;margin-left:2px}

  .legend{
    max-width:1280px;margin:0 auto;padding:6px 20px 10px;
    display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);align-items:center;
  }
  .legend .item{display:inline-flex;align-items:center;gap:6px}
  .dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);display:inline-block;flex:none}
  .dot.restaurant{background:var(--c-restaurant)} .dot.cafe{background:var(--c-cafe)}
  .dot.bakery{background:var(--c-bakery)} .dot.etc{background:var(--c-etc)}

  main.layout{
    max-width:1280px;margin:0 auto;padding:4px 20px 20px;
    display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start;
  }
  .mapwrap{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;position:sticky;top:12px;
  }
  #map{height:max(60vh, calc(100vh - 250px));min-height:420px;width:100%;z-index:0;background:#e8e6df}
  .mapnote{padding:8px 14px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line)}

  .listcol{min-width:0}
  .result-line{font-size:13.5px;color:var(--ink2);margin:2px 2px 10px}
  .region-head{
    font-size:15px;font-weight:800;margin:18px 2px 8px;display:flex;align-items:baseline;gap:8px;
  }
  .region-head:first-child{margin-top:2px}
  .region-head .rn{font-size:12.5px;color:var(--ink2);font-weight:600}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:13px 15px;margin-bottom:9px;cursor:pointer;text-align:left;width:100%;
    font:inherit;color:inherit;display:block;
  }
  .card:hover{border-color:var(--accent)}
  .card.active{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent)}
  .card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .name{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .badge{font-size:11.5px;font-weight:700;padding:2.5px 8px;border-radius:999px;color:#fff;flex:none}
  .badge.restaurant{background:var(--c-restaurant)} .badge.cafe{background:var(--c-cafe)}
  .badge.bakery{background:var(--c-bakery)} .badge.etc{background:var(--c-etc)}
  .card .addr{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.45}
  .empty{
    background:var(--surface);border:1px dashed var(--line);border-radius:14px;
    padding:28px 16px;text-align:center;color:var(--ink2);font-size:14.5px;
  }

  footer.foot{
    max-width:1280px;margin:0 auto;padding:6px 20px 30px;
    color:var(--ink2);font-size:13px;line-height:1.6;border-top:1px solid var(--line);
  }

  /* Leaflet popup */
  .kdot{width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
  .kpop{position:relative;background:#fff;color:#222;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);padding:14px 16px;min-width:210px;max-width:260px;font-size:14px;line-height:1.5;white-space:normal}
  .kpop-x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:20px;line-height:1;color:#888;cursor:pointer}
  .leaflet-popup-content{font-family:inherit;font-size:14px;line-height:1.5;margin:14px 16px;min-width:210px}
  .pop-name{font-size:16.5px;font-weight:800;margin:0 0 2px}
  .pop-cat{font-size:12.5px;font-weight:700}
  .pop-addr{color:#555;margin:6px 0 10px;font-size:13.5px}
  .pop-links{display:flex;flex-direction:column;gap:6px}
  .pop-links a{font-weight:600;text-decoration:none}
  .pop-naver{
    display:inline-block;background:#03a94d;color:#fff !important;text-align:center;
    padding:9px 12px;border-radius:9px;font-weight:700;
  }

  @media (max-width:860px){
    main.layout{grid-template-columns:1fr}
    .mapwrap{position:static}
    #map{height:60vh;min-height:320px}
    header.top{padding:18px 16px 4px}
    .toolbar,.legend{padding-left:16px;padding-right:16px}
    main.layout{padding:4px 16px 16px}
    footer.foot{padding:6px 16px 26px}
  }
</style>
</head>

":127.5249829,"naver_url":"https://map.naver.com/p/entry/place/1034140993"},{"shop_name":"해소리카페","category":"카페","address":"전라남도 순천시 해룡면 동명초등길 10 1층","lat":34.946812,"lng":127.5284303,"naver_url":"https://map.naver.com/p/entry/place/2045815560"},{"shop_name":"먹돌고기국수 제주본점","category":"식당","address":"제주특별자치도 제주시 공항로1길 14 1층","lat":33.5035801,"lng":126.4979547,"naver_url":"https://map.naver.com/p/entry/place/1131737857"},{"shop_name":"팔복만두","category":"식당","address":"제주특별자치도 제주시 관덕로 11-1 1층","lat":33.5131621,"lng":126.5206397,"naver_url":"https://map.naver.com/p/entry/place/1820281252"},{"shop_name":"고국수 공항본점","category":"식당","address":"제주특별자치도 제주시 용문로14길 4 1층","lat":33.5064392,"lng":126.5091408,"naver_url":"https://map.naver.com/p/entry/place/1041325506"},{"shop_name":"진걸찬","category":"식당","address":"충청남도 당진시 신평면 매산해변길 199 1층","lat":36.924991,"lng":126.804247,"naver_url":"https://map.naver.com/p/entry/place/2089837742"}];

/* ---------- 카테고리 그룹 ---------- */
function groupOf(cat){
  if(cat === '식당' || cat === '정육점·식당' || cat === '술집') return 'restaurant';
  if(cat === '카페' || cat === '카페·디저트') return 'cafe';
  if(cat === '베이커리' || cat === '베이커리·디저트' || cat === '카페/베이커리') return 'bakery';
  return 'etc';
}
var GROUPS = {
  restaurant:{label:'식당', color:'#d9480f'},
  cafe:{label:'카페', color:'#1971c2'},
  bakery:{label:'베이커리·디저트', color:'#e8890c'},
  etc:{label:'기타 (과일 등)', color:'#2f9e44'}
};
SHOPS.forEach(function(s, i){ s._group = groupOf(s.category); s._id = 's' + i; });

/* ---------- 지역(시·도) 추출 ---------- */
var REGION_SHORT = {
  '서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천',
  '광주광역시':'광주','대전광역시':'대전','울산광역시':'울산','세종특별자치시':'세종',
  '경기도':'경기','강원특별자치도':'강원','충청북도':'충북','충청남도':'충남',
  '전라북도':'전북','전북특별자치도':'전북','전라남도':'전남','경상북도':'경북',
  '경상남도':'경남','제주특별자치도':'제주'
};
function regionOf(addr){
  var first = (addr || '').split(' ')[0];
  return REGION_SHORT[first] || first;
}
SHOPS.forEach(function(s){ s._region = regionOf(s.address); });

/* ---------- 지도 (카카오맵) ---------- */
var HAS_MAP = (typeof kakao !== 'undefined' && kakao.maps);
var map = null;
var markers = {};
var bounds = null;
var infoOverlay = null;

/* 같은 좌표 핀 겹침 처리: 살짝 어긋나게 표시 */
var coordKey = function(s){ return s.lat.toFixed(5) + ',' + s.lng.toFixed(5); };
var byCoord = {};
SHOPS.forEach(function(s){ (byCoord[coordKey(s)] = byCoord[coordKey(s)] || []).push(s); });
Object.keys(byCoord).forEach(function(k){
  var arr = byCoord[k];
  if(arr.length > 1){
    arr.forEach(function(s, i){
      var ang = (Math.PI * 2 * i) / arr.length;
      s._dlat = s.lat + Math.sin(ang) * 0.0011;
      s._dlng = s.lng + Math.cos(ang) * 0.0014;
    });
  }
});
SHOPS.forEach(function(s){ if(s._dlat === undefined){ s._dlat = s.lat; s._dlng = s.lng; } });

function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function popupHTML(s){
  var g = GROUPS[s._group];
  return '<p class="pop-name">' + esc(s.shop_name) + '</p>' +
    '<span class="pop-cat" style="color:' + g.color + '">' + esc(s.category) + '</span>' +
    '<p class="pop-addr">' + esc(s.address) + '</p>' +
    '<div class="pop-links">' +
      '<a class="pop-naver" href="' + esc(s.naver_url) + '" target="_blank" rel="noopener">네이버 지도에서 보기</a>' +
    '</div>';
}

function refreshMapSize(refit){
  if(!map) return;
  map.relayout();
  if(refit && bounds) map.setBounds(bounds);
}

function closeInfo(){ if(infoOverlay){ infoOverlay.setMap(null); } }
function openInfo(s){
  if(!map) return;
  closeInfo();
  var box = document.createElement('div');
  box.className = 'kpop';
  box.innerHTML = '<button type="button" class="kpop-x" aria-label="닫기">×</button>' + popupHTML(s);
  box.querySelector('.kpop-x').addEventListener('click', function(e){ e.stopPropagation(); closeInfo(); });
  ['mousedown','touchstart','touchend','pointerdown','click','dblclick'].forEach(function(ev){
    box.addEventListener(ev, function(e){ e.stopPropagation(); }, {passive:true});
  });
  var link = box.querySelector('.pop-naver');
  if(link){ link.addEventListener('click', function(e){ e.stopPropagation(); e.preventDefault(); var w = window.open(link.href, '_blank', 'noopener'); if(!w){ location.href = link.href; } }); }
  infoOverlay = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(s._dlat, s._dlng), content: box, yAnchor: 1.15, zIndex: 10, clickable: true
  });
  infoOverlay.setMap(map);
}

function highlightCard(s){
  document.querySelectorAll('.card.active').forEach(function(c){ c.classList.remove('active'); });
  var card = document.getElementById('card-' + s._id);
  if(card){
    card.classList.add('active');
    card.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}

function initMap(){
  if(!HAS_MAP || map) return;
  var el = document.getElementById('map');
  if(!el) return;
  if(el.clientHeight === 0 || el.clientWidth === 0){ requestAnimationFrame(initMap); return; }
  map = new kakao.maps.Map(el, { center: new kakao.maps.LatLng(36.4, 127.8), level: 13 });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

  bounds = new kakao.maps.LatLngBounds();
  SHOPS.forEach(function(s){
    var g = GROUPS[s._group];
    var pos = new kakao.maps.LatLng(s._dlat, s._dlng);
    bounds.extend(pos);
    var dot = document.createElement('div');
    dot.className = 'kdot';
    dot.style.background = g.color;
    dot.title = s.shop_name;
    dot.addEventListener('click', function(){
      if(map.getLevel() > 5){ map.setLevel(3); }
      map.setCenter(pos);
      openInfo(s);
      highlightCard(s);
    });
    var ov = new kakao.maps.CustomOverlay({ position: pos, content: dot, xAnchor: 0.5, yAnchor: 0.5, zIndex: 2 });
    ov.setMap(map);
    markers[s._id] = ov;
  });
  kakao.maps.event.addListener(map, 'click', closeInfo);
  map.setBounds(bounds);
  setTimeout(function(){ refreshMapSize(true); }, 300);
  if(typeof render === 'function') render();
}

if(!HAS_MAP){
  document.getElementById('map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink2);font-size:14px;padding:20px;text-align:center">지도를 불러오지 못했습니다. 아래 목록에서 가게를 확인해 주세요.</div>';
} else {
  kakao.maps.load(function(){
    if(document.readyState === 'complete'){ requestAnimationFrame(initMap); }
    else { window.addEventListener('load', function(){ requestAnimationFrame(initMap); }); }
  });
}

/* ---------- 필터 / 검색 / 목록 ---------- */
var state = { group: 'all', q: '' };
var filtersEl = document.getElementById('filters');
var legendEl = document.getElementById('legend');
var listEl = document.getElementById('list');
var resultLine = document.getElementById('resultLine');

var counts = { all: SHOPS.length };
Object.keys(GROUPS).forEach(function(k){
  counts[k] = SHOPS.filter(function(s){ return s._group === k; }).length;
});

function makeFilterBtn(key, label){
  var b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('aria-pressed', state.group === key ? 'true' : 'false');
  b.innerHTML = esc(label) + ' <span class="n">' + counts[key] + '</span>';
  b.addEventListener('click', function(){ state.group = key; render(); });
  b.dataset.key = key;
  return b;
}
function renderFilters(){
  filtersEl.innerHTML = '';
  filtersEl.appendChild(makeFilterBtn('all', '전체'));
  Object.keys(GROUPS).forEach(function(k){ filtersEl.appendChild(makeFilterBtn(k, GROUPS[k].label)); });
}
legendEl.innerHTML = '<span style="font-weight:700;color:var(--ink)">핀 색상</span>' +
  Object.keys(GROUPS).map(function(k){
    return '<span class="item"><span class="dot ' + k + '"></span>' + esc(GROUPS[k].label) + ' ' + counts[k] + '곳</span>';
  }).join('');

function matches(s){
  if(state.group !== 'all' && s._group !== state.group) return false;
  if(!state.q) return true;
  var q = state.q.toLowerCase();
  return (s.shop_name + ' ' + s.address + ' ' + s.category + ' ' + s._region)
    .toLowerCase().indexOf(q) !== -1;
}

var REGION_ORDER = ['서울','경기','인천','강원','충북','충남','대전','세종','전북','전남','광주','경북','대구','경남','부산','울산','제주'];
function regionRank(r){
  var i = REGION_ORDER.indexOf(r);
  return i === -1 ? 99 : i;
}

function focusShop(s, openPopup){
  if(HAS_MAP && map){
    var go = function(){
      map.relayout();
      map.setLevel(3);
      map.setCenter(new kakao.maps.LatLng(s._dlat, s._dlng));
      if(openPopup) openInfo(s);
    };
    go();
    setTimeout(go, 400);
  }
  document.querySelectorAll('.card.active').forEach(function(c){ c.classList.remove('active'); });
  var card = document.getElementById('card-' + s._id);
  if(card) card.classList.add('active');
}

function render(){
  renderFilters();
  var visible = SHOPS.filter(matches);

  /* 마커 표시/숨김 */
  if(HAS_MAP && map){
    SHOPS.forEach(function(s){
      var m = markers[s._id];
      if(!m) return;
      var show = visible.indexOf(s) !== -1;
      m.setMap(show ? map : null);
    });
  }

  resultLine.textContent = visible.length === SHOPS.length
    ? '전체 ' + SHOPS.length + '곳을 지역별로 정리했습니다.'
    : '검색 결과 ' + visible.length + '곳';

  if(!visible.length){
    listEl.innerHTML = '<div class="empty">조건에 맞는 가게가 없습니다.<br />검색어나 카테고리를 바꿔 보세요.</div>';
    return;
  }

  /* 지역 그룹 + 가나다순 */
  var byRegion = {};
  visible.forEach(function(s){ (byRegion[s._region] = byRegion[s._region] || []).push(s); });
  var regions = Object.keys(byRegion).sort(function(a,b){ return regionRank(a) - regionRank(b) || a.localeCompare(b, 'ko'); });

  var html = '';
  regions.forEach(function(r){
    var arr = byRegion[r].slice().sort(function(a,b){ return a.shop_name.localeCompare(b.shop_name, 'ko'); });
    html += '<h2 class="region-head">' + esc(r) + ' <span class="rn">' + arr.length + '곳</span></h2>';
    arr.forEach(function(s){
      html += '<button type="button" class="card" id="card-' + esc(s._id) + '" data-id="' + esc(s._id) + '">' +
        '<span class="row1"><span class="name">' + esc(s.shop_name) + '</span>' +
        '<span class="badge ' + s._group + '">' + esc(s.category) + '</span></span>' +
        '<span class="addr" style="display:block">' + esc(s.address) + '</span>' +
      '</button>';
    });
  });
  listEl.innerHTML = html;
  listEl.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('click', function(){
      var s = SHOPS.filter(function(x){ return x._id === card.dataset.id; })[0];
      if(s){
        if(window.innerWidth <= 860){
          document.querySelector('.mapwrap').scrollIntoView({behavior:'auto', block:'start'});
        }
        focusShop(s, true);
      }
    });
  });
}

document.getElementById('q').addEventListener('input', function(e){
  state.q = e.target.value.trim();
  render();
});

render();
</script>
